# Add ONE of these lines to /config/secrets.yaml (never commit the real file).

# Repo is public: no token needed.
merci_home_pull_cmd: "sh -c 'set -e; rm -rf /tmp/mh; mkdir -p /tmp/mh /config/www/merci-home /config/dashboards; curl -fsSL https://codeload.github.com/vlad8110/adaptive-shade-dashboard/tar.gz/refs/heads/live | tar -xz -C /tmp/mh --strip-components=1; cp -rf /tmp/mh/www/merci-home/. /config/www/merci-home/; cp -f /tmp/mh/dashboards/my-home.yaml /config/dashboards/my-home.yaml; rm -rf /tmp/mh'"

# Repo is private: replace GITHUB_TOKEN with a fine-grained token that has
# read-only "Contents" access to this one repository.
# merci_home_pull_cmd: "sh -c 'set -e; rm -rf /tmp/mh; mkdir -p /tmp/mh /config/www/merci-home /config/dashboards; curl -fsSL -H \"Authorization: Bearer GITHUB_TOKEN\" https://api.github.com/repos/vlad8110/adaptive-shade-dashboard/tarball/live | tar -xz -C /tmp/mh --strip-components=1; cp -rf /tmp/mh/www/merci-home/. /config/www/merci-home/; cp -f /tmp/mh/dashboards/my-home.yaml /config/dashboards/my-home.yaml; rm -rf /tmp/mh'"
